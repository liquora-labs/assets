name: Sync Chainlist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync-chainlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Run chainlist sync
        env:
          CHAINLIST_URL: ${{ secrets.CHAIN_LIST_API_URL }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CHAIN_LIST_NAME: "Liquora Chains"
          CHAIN_LIST_MAINNET_OUTPUT_PATH: "public/assets/chains/mainnets.json"
          CHAIN_LIST_TESTNET_OUTPUT_PATH: "public/assets/chains/testnets.json"
        run: npm run sync:chains

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git checkout -b sync-chainlist || git checkout sync-chainlist
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync chainlist $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push origin sync-chainlist --force
          else
            echo "No changes to commit"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: sync-chainlist
          title: "Sync chainlist"
          body: |
            This PR updates the chainlist assets.
            - Updated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - Files changed: chainlist JSONs
          draft: false
